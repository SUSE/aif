global:
  # Override the registry host (and optional path prefix) for every image
  # rendered by this chart. When the UI is installed through aiExtension, this
  # value is also forwarded to the aif-ui chart unless that nested chart has an
  # explicit global.imageRegistry or legacy image.registry override.
  imageRegistry: ""
  # Pull Secrets used by the operator, helper Jobs, and the managed aif-ui chart.
  # An explicit nested aiExtension.source.helm.values.global.imagePullSecrets
  # value takes precedence for the UI, including an intentionally empty list.
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Credentials for SUSE Application Collection, NVIDIA NGC, and
# SUSE Registry artifact repositories. If not specified, those
# credentials must be created out-of-band and via Settings
# in the UI.
#
# NOTE: the credentials configured in this file are meant to be
# used during installation/configuration of the chart. Therefore,
# credentials must be handled in accordance with your organization's
# security policies. Please sanitize the credentials before checking
# this file into source control.
#
credentials:
  # credential for oci://dp.apps.rancher.io/charts
  applicationCollection:
    username: ""
    password: ""
  # credential to pull NGC artifacts
  # e.g. https://helm.ngc.nvidia.com/nvidia
  nvidia:
    username: ""
    password: ""
  # credential for oci://registry.suse.com/ai/charts
  suseRegistry:
    username: ""
    password: ""

# Rancher catalog integration. REQUIRED to install charts from git-backed
# ClusterRepos (spec.gitRepo): they have no HTTP/OCI URL, so the operator fetches
# the chart from Rancher's Steve catalog API. HTTP/OCI ClusterRepos need none of
# this.
rancherCatalog:
  # url: in-cluster Rancher API endpoint.
  url: "https://rancher.cattle-system.svc"
  # token: a Rancher API token (format "token-xxxxx:yyyyy"). REQUIRED for
  # git-backed repos — Rancher's Steve API rejects the operator ServiceAccount
  # token, so there is no implicit credential. Create one in Rancher under
  # "Account & API Keys". When set, the chart stores it in a Secret. Leave empty
  # to reference an existing Secret via tokenSecret, or to disable git-backed
  # repo support (git-backed components then report a clear Ready=False status).
  # NOTE: an inline token is persisted in a chart-managed Secret AND in Helm's
  # release history/metadata (standard Helm behavior). Since this is a Rancher API
  # token, prefer tokenSecret below to keep it out of release history.
  # If you use the UI's Authorize button, leave both `token` and `tokenSecret`
  # empty: with either set, a `helm upgrade` re-renders
  # spec.rancherCatalog.tokenSecretRef from the chart, and Helm's three-way merge
  # reverts the reference Authorize repointed — silently swapping a fresh token
  # back for an expired one.
  token: ""
  # tokenSecret: reference an existing Secret holding the token instead of
  # providing `token` inline. Takes precedence over `token` when name is set.
  tokenSecret:
    name: ""
    key: "token"
  # caBundle: PEM CA certificate(s) that signed Rancher's serving certificate.
  # Normally leave this empty: when unset, the operator reads the CA from
  # cattle-system/tls-rancher-internal-ca, which is the CA that signs Rancher's
  # in-cluster serving certificate. Set it only to pin a different CA — note that
  # the `cacerts` Setting is the ingress/public CA, a DIFFERENT certificate, and
  # using it here produces an x509 failure. When set but unreadable, the operator
  # falls back to system roots rather than to discovery.
  caBundle: ""
  # insecureSkipVerify: skip TLS verification of the Rancher API. Development
  # only — do not use in production/air-gapped installs.
  insecureSkipVerify: false

# Static application catalog served to the AI Factory UI.
appCatalog:
  # useStaticCatalog: serve the bundled/remote static catalog (true, default) or
  # discover apps from live chart repositories at runtime (false). This is a UI
  # setting; the chart forwards it to the aif-ui extension automatically, so set it
  # here as a sibling of remoteUrl instead of via
  # aiExtension.source.helm.values.appCatalog.useStaticCatalog.
  useStaticCatalog: true
  # remoteUrl: optional URL to a remote catalog JSON document. When set, the
  # operator fetches this URL and serves it to the UI (with a safe fallback to
  # the operator's bundled catalog on failure). When empty, the bundled catalog
  # is used.
  # Must be a public http(s) URL; internal/private addresses are rejected.
  remoteUrl: ""

manager:
  replicaCount: 1

  image:
    registry: ghcr.io
    repository: suse/aif-operator
    tag: "2.2.0-dev.2"
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  args:
    - --leader-elect

  # allowInsecureRegistryTLS gates the InstallAIExtension
  # spec.source.helm.tls.insecureSkipVerify option, which disables registry TLS
  # certificate verification for the extension chart pull. Leave false in
  # production; set to true only for testing/eval against a registry with an
  # untrusted certificate. A CR must ALSO set tls.acknowledgeInsecure=true.
  allowInsecureRegistryTLS: false

  # allowedRegistryHosts restricts which registry hosts the operator may contact
  # (and send credentials to) when pulling the extension chart. Empty (default)
  # allows any host. Set to your registry host(s) to bound the CR-supplied
  # chartURL and prevent credentials from being sent to an attacker-chosen
  # registry. Match "host" or "host:port"; e.g.:
  #   allowedRegistryHosts:
  #     - harbor.example.com
  #     - ghcr.io
  allowedRegistryHosts: []

  env: []

  podAnnotations: {}

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
        type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
        drop:
            - ALL
    readOnlyRootFilesystem: true

  resources:
    limits:
        cpu: 500m
        memory: 128Mi
    requests:
        cpu: 10m
        memory: 64Mi

  probes:
    liveness:
      enabled: true
      httpGet:
        path: /healthz
        port: 8081
      periodSeconds: 20
      initialDelaySeconds: 15
    readiness:
      enabled: true
      httpGet:
        path: /readyz
        port: 8081
      periodSeconds: 10
      initialDelaySeconds: 5

  nodeSelector: {}
  tolerations: []
  affinity: {}

rbacHelpers:
  enable: false

metrics:
  enable: true
  port: 8443

api:
  port: 8080

# UI extension auto-install — creates an InstallAIExtension CR when the operator is deployed.
# Set aiExtension.enabled=false to skip extension installation.
aiExtension:
  enabled: true
  source:
    kind: Helm
    helm:
      chartURL: "oci://ghcr.io/suse/chart/aif-ui"
      version: "2.2.0-dev.2"
      # values are merged onto the aif-ui chart's default values. The top-level
      # global image registry and pull Secrets are forwarded here automatically.
      # Existing per-component overrides remain supported, for example:
      #   aiExtension.source.helm.values.image.registry=ghcr.io
      #   aiExtension.source.helm.values.image.repository=suse/aif-ui
      #   aiExtension.source.helm.values.image.tag=2.0.0
      values: {}
      # --- Private / authenticated registry for the chart pull (all optional) ---
      # Secrets are read from the operator's namespace. See the InstallAIExtension CRD
      # and operator/samples/installaiextension-authenticated*.yaml for the full schema.
      # auth:                          # set exactly one of basic | token | dockerConfig
      #   basic:
      #     userSecretRef:  { name: registry-creds, key: username }
      #     tokenSecretRef: { name: registry-creds, key: password }
      #   # token:
      #   #   tokenSecretRef: { name: registry-creds, key: token }
      #   # dockerConfig:
      #   #   secretRef: { name: registry-dockercfg }    # kubernetes.io/dockerconfigjson
      # tls:
      #   caSecretRef: { name: registry-ca, key: ca.crt }
      #   # clientTLSSecretRef: { name: registry-mtls }  # kubernetes.io/tls (mTLS)
      #   # insecureSkipVerify: true                     # test only; also requires
      #   # acknowledgeInsecure: true                    #   manager.allowInsecureRegistryTLS=true
  extension:
    name: "aif-ui"
    version: "2.2.0-dev.2"
  cleanup:
    image:
      registry: registry.suse.com
      repository: suse/kubectl
      tag: "1.35"
      pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 32Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true

# Default blueprints bundled with the chart. When enabled, the curated Blueprint
# CRs under files/blueprints/ are created on install and reconciled on upgrade.
# Disable to manage blueprints exclusively through other means (e.g. a future
# git source) without the chart re-creating its defaults.
defaultBlueprints:
  enabled: true

# CRD lifecycle. The chart ships its CRDs under Helm's standard crds/ directory,
# so Helm natively installs them before it builds the release manifest (the
# chart's own Blueprint/Settings/InstallAIExtension resources depend on that).
# Helm never upgrades crds/ after install, so when manageWithJob is true a
# pre-install/pre-upgrade hook Job server-side-applies the chart's CRDs to carry
# schema changes forward without a manual `kubectl apply`. The Job only applies
# CRDs (never deletes them), so uninstall safety is preserved. Set manageWithJob
# to false in restricted environments where the installer may not create
# CRD-managing RBAC, and apply the CRDs out-of-band instead
# (kubectl apply --server-side -f crds/).
crds:
  # Upgrade CRDs via the pre-install/pre-upgrade hook Job. CRDs are installed on
  # first install by Helm's native crds/ path regardless of this setting; the Job
  # is what carries schema changes forward on `helm upgrade` (Helm never upgrades
  # crds/ itself). Set to false to skip the Job — no kubectl image or cluster-scoped
  # hook RBAC needed — but then you must apply crds/ out-of-band before upgrades.
  manageWithJob: true
  # RBAC for the CRD-apply hook Job. Set create=false in restricted environments
  # where the installer may not create cluster-scoped RBAC. Then pre-provision the
  # ServiceAccount + ClusterRole + ClusterRoleBinding out-of-band and point
  # serviceAccountName at the pre-created ServiceAccount (which must live in the
  # release namespace). CRDs are still applied by the Job — no need to disable it.
  rbac:
    create: true
  # ServiceAccount the CRD-apply Job runs as. Empty = the chart's own
  # "<fullname>-crd-apply" SA (created when rbac.create=true). Set this to a
  # pre-provisioned SA when rbac.create=false.
  serviceAccountName: ""
  image:
    registry: registry.suse.com
    repository: suse/kubectl
    tag: "1.35"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
