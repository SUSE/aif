suite: services — metrics endpoint only; the operator API has no Service
# Every template is listed so the no-API-Service and upgrade assertions below
# cover the whole chart, not a hand-picked subset. The other tests pin their
# template explicitly.
templates:
  - templates/*.yaml
  - templates/**/*.yaml
chart:
  version: 9.9.9
  appVersion: 9.9.9
# The chart refuses pinned versions older than its appVersion (upgrade guard,
# see upgrade_guard_test.yaml); pin them to the suite's appVersion so the
# release workflow's version rewrites cannot break these assertions.
set:
  manager.image.tag: "9.9.9"
  aiExtension.source.helm.version: "9.9.9"
  aiExtension.extension.version: "9.9.9"
release:
  name: my-release
  namespace: aif-operator
tests:
  - it: the metrics service is rendered by default
    template: templates/metrics/controller-manager-metrics-service.yaml
    asserts:
      - containsDocument:
          kind: Service
          apiVersion: v1
          name: aif-operator-metrics
          namespace: aif-operator
      - equal:
          path: spec.ports
          value:
            - name: https
              port: 8443
              targetPort: 8443
              protocol: TCP

  - it: disabling metrics removes the metrics service entirely
    template: templates/metrics/controller-manager-metrics-service.yaml
    set:
      metrics.enable: false
    asserts:
      - hasDocuments:
          count: 0

  - it: the metrics service port follows metrics.port
    template: templates/metrics/controller-manager-metrics-service.yaml
    set:
      metrics.port: 9443
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 9443
      - equal:
          path: spec.ports[0].targetPort
          value: 9443

  - it: the metrics service selects the operator pods
    template: templates/metrics/controller-manager-metrics-service.yaml
    asserts:
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: aif-operator
            app.kubernetes.io/instance: my-release

  # The operator API is served only over Rancher's APIService aggregation
  # tunnel, so the chart exposes no API port: the only Service is metrics.
  - it: the only Service in the chart is the metrics service, and none exposes port 8080
    documentSelector:
      path: kind
      value: Service
      matchMany: true
      skipEmptyTemplates: true
    asserts:
      - equal:
          path: metadata.name
          value: aif-operator-metrics
      - notContains:
          path: spec.ports
          content:
            port: 8080
          any: true

  # A values file or earlier release (2.4.0) may still set the removed api.port.
  # The schema has no additionalProperties: false, so it validates, and nothing
  # reads it.
  - it: a stale api.port value from an earlier release is ignored
    set:
      api:
        port: 8080
    asserts:
      - notContains:
          path: spec.ports
          content:
            port: 8080
          any: true
        documentSelector:
          path: kind
          value: Service
          matchMany: true
          skipEmptyTemplates: true

  - it: with stale api.port set, the manager has no API port or bind-address flag
    template: templates/manager/manager.yaml
    set:
      api:
        port: 8080
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].ports
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --api-bind-address=:8080
