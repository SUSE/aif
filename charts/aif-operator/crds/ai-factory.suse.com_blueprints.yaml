---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: blueprints.ai-factory.suse.com
spec:
  group: ai-factory.suse.com
  names:
    kind: Blueprint
    listKind: BlueprintList
    plural: blueprints
    shortNames:
    - bp
    singular: blueprint
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Blueprint is the Schema for the blueprints API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BlueprintSpec defines the desired state of a Blueprint version.
            properties:
              components:
                description: Components are the applications included in this blueprint.
                items:
                  description: |-
                    BlueprintComponent defines one deployable application in a Blueprint.
                    New Blueprints should use ApplicationRef. The direct chart fields remain as
                    a compatibility path for existing and custom Blueprints.
                  properties:
                    applicationRef:
                      description: ApplicationRef is the preferred source-independent
                        application identity.
                      properties:
                        name:
                          description: Name is the cluster-scoped Application resource
                            name.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                        version:
                          description: Version is the chart version pinned by this
                            Blueprint qualification.
                          minLength: 1
                          type: string
                      required:
                      - name
                      - version
                      type: object
                    chartName:
                      description: 'ChartName is the Helm chart name. Deprecated:
                        use ApplicationRef.'
                      minLength: 1
                      type: string
                    chartRepo:
                      description: |-
                        ChartRepo is the Rancher ClusterRepo name. HTTP, OCI, and git-backed
                        ClusterRepos are supported. For git-backed repos (spec.gitRepo) the operator
                        fetches the chart from Rancher's catalog and deploys it as a self-contained
                        Fleet Bundle; such charts must compress to under ~1MiB. Deprecated: use
                        ApplicationRef.
                      minLength: 1
                      type: string
                    chartVersion:
                      description: 'ChartVersion is the semver chart version. Deprecated:
                        use ApplicationRef.'
                      minLength: 1
                      type: string
                    releaseName:
                      description: |-
                        ReleaseName optionally pins this component's Helm release name.
                        When empty, the chart name is used (the historical default). The operator
                        still passes this through capReleaseName, so a value within the limit is
                        used verbatim while an over-long one is truncated to a valid release name.
                        Must be a valid Helm release name (lowercase alphanumerics and '-', starting
                        and ending with an alphanumeric, max 53 chars — Helm/Fleet's release-name limit).
                      maxLength: 53
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    targetNamespace:
                      description: |-
                        TargetNamespace optionally pins this component to a fixed namespace.
                        When empty, the AIWorkload's targetNamespace (from the install wizard) is used.
                        Must be a valid DNS-1123 label (lowercase alphanumerics and '-', starting
                        and ending with an alphanumeric, max 63 chars).
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    values:
                      description: Values are the Helm values for this component.
                      x-kubernetes-preserve-unknown-fields: true
                    vendor:
                      description: |-
                        Vendor selects the secret-injection profile for a legacy direct chart
                        component. Application-backed components obtain this explicitly from the
                        Application and must omit Vendor.
                      enum:
                      - suse
                      - nvidia
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of applicationRef or the direct chart
                      fields
                    rule: has(self.applicationRef) != has(self.chartRepo)
                  - message: chartRepo, chartName, and chartVersion must be set together
                    rule: has(self.chartRepo) == has(self.chartName) && has(self.chartRepo)
                      == has(self.chartVersion)
                  - message: vendor belongs to the Application credential profile
                      when applicationRef is set
                    rule: '!has(self.applicationRef) || !has(self.vendor)'
                minItems: 1
                type: array
              deprecated:
                description: Deprecated marks this blueprint version as deprecated.
                type: boolean
              description:
                description: Description is an optional human-readable description.
                type: string
              displayName:
                description: DisplayName is the human-readable name shared across
                  all versions.
                minLength: 1
                type: string
              source:
                description: |-
                  Source identifies where this blueprint came from (SUSE, Nvidia, or Custom).
                  To leave the source unset, omit the field entirely; the enum does not
                  include the empty string, so setting `source: ""` will fail admission.
                enum:
                - SUSE
                - Nvidia
                - Custom
                type: string
              version:
                description: Version is the semver version string of this blueprint.
                pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[a-zA-Z0-9.-]+)?(\+[a-zA-Z0-9.-]+)?$
                type: string
            required:
            - components
            - displayName
            - version
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
