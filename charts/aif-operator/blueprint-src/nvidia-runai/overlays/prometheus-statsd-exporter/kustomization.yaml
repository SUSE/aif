apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ca.yaml
  - crd-run.ai-clusters.yaml
  - namespace-runai.yaml
  - preflight.yaml
configMapGenerator:
  - name: runai-preflight-script
    namespace: runai-backend
    files:
      - preflight.py
patches:
  # Fleet v0.14 dry-runs the runai-cluster chart before installing its crds/, so the CRD
  # is created here first. crd-run.ai-clusters.yaml is the chart's file verbatim; keep
  # stops a setup uninstall from deleting the CRD and with it the Run:ai Cluster object.
  - target:
      kind: CustomResourceDefinition
      name: clusters.run.ai
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: clusters.run.ai
        annotations:
          helm.sh/resource-policy: keep
  # The carrier chart's own workload must not run; names follow releaseName runai-setup.
  - target:
      kind: Deployment
      name: runai-setup-prometheus-statsd-exporter
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: runai-setup-prometheus-statsd-exporter
  - target:
      kind: Service
      name: runai-setup-prometheus-statsd-exporter
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: runai-setup-prometheus-statsd-exporter
