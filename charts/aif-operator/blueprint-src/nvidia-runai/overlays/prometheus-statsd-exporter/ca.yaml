apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: runai-selfsigned
  namespace: runai-backend
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: runai-ca
  namespace: runai-backend
spec:
  isCA: true
  commonName: Run:ai CA
  duration: 87600h
  secretName: runai-ca-keypair
  privateKey:
    algorithm: ECDSA
  issuerRef:
    name: runai-selfsigned
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: runai-ca-issuer
  namespace: runai-backend
spec:
  ca:
    secretName: runai-ca-keypair
