apiVersion: v1
kind: ServiceAccount
metadata:
  name: runai-preflight
  namespace: runai-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-preflight
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [list]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runai-preflight
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runai-preflight
subjects:
  - kind: ServiceAccount
    name: runai-preflight
    namespace: runai-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runai-preflight
  namespace: runai-backend
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [runai-preflight-result]
    verbs: [get, update]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    resourceNames: [runai-ca]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runai-preflight
  namespace: runai-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runai-preflight
subjects:
  - kind: ServiceAccount
    name: runai-preflight
    namespace: runai-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runai-preflight
  namespace: runai-backend
  labels:
    app.kubernetes.io/name: runai-preflight
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: runai-preflight
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runai-preflight
    spec:
      serviceAccountName: runai-preflight
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: preflight
          image: registry.suse.com/bci/python:3.12
          command: [python3, /scripts/preflight.py]
          # Summed over all nodes; see preflight.py. Lower them only on a cluster you know is enough.
          env:
            - name: PREFLIGHT_MIN_CORES
              value: "20"
            - name: PREFLIGHT_MIN_MEMORY_GB
              value: "32"
            - name: PREFLIGHT_MIN_STORAGE_GB
              value: "160"
          readinessProbe:
            exec:
              command: [python3, /scripts/preflight.py, --ready]
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: runai-preflight-script
        - name: tmp
          emptyDir: {}
