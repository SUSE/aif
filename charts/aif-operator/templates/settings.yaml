{{- $credentials := index .Values "credentials" -}}
{{- $rc := .Values.rancherCatalog -}}
{{- $rcSecret := $rc.tokenSecret.name | default (printf "%s-rancher-catalog" (include "aif-operator.fullname" .)) -}}
apiVersion: ai-factory.suse.com/v1alpha1
kind: Settings
metadata:
  name: settings
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aif-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
{{- if or (and $credentials.applicationCollection.username $credentials.applicationCollection.password)
          (and $credentials.nvidia.username $credentials.nvidia.password)
          (and $credentials.suseRegistry.username $credentials.suseRegistry.password)
          .Values.appCatalog.remoteUrl
          $rc.token $rc.tokenSecret.name }}
spec:
{{- if .Values.appCatalog.remoteUrl }}
  appCatalog:
    remoteUrl: {{ .Values.appCatalog.remoteUrl | quote }}
{{- end }}
{{- /*
  rancherCatalog is emitted only when a token is supplied (inline or via an
  existing secret). A git-backed ClusterRepo always needs a Rancher API token,
  so a rancherCatalog.caBundle set on its own has nothing to authenticate and is
  intentionally ignored here — set rancherCatalog.token (or .tokenSecret) too.
  Note: secrets.yaml still creates the -rancher-catalog Secret for a caBundle-only
  config, which is then an unreferenced orphan.
*/ -}}
{{- if or $rc.token $rc.tokenSecret.name }}
  rancherCatalog:
    {{- if $rc.url }}
    url: {{ $rc.url | quote }}
    {{- end }}
    tokenSecretRef:
      name: {{ $rcSecret }}
      key: {{ $rc.tokenSecret.key | default "token" }}
    {{- if $rc.caBundle }}
    caBundleSecretRef:
      name: {{ include "aif-operator.fullname" . }}-rancher-catalog
      key: ca.crt
    {{- end }}
    {{- if $rc.insecureSkipVerify }}
    insecureSkipVerify: true
    {{- end }}
{{- end }}
{{- if and $credentials.applicationCollection.username $credentials.applicationCollection.password }}
  applicationCollection:
    tokenSecretRef:
      key: token
      name: application-collection
    userSecretRef:
      key: user
      name: application-collection
{{- end }}
{{- if and $credentials.nvidia.username $credentials.nvidia.password }}
  nvidia:
    tokenSecretRef:
      key: token
      name: nvidia-registry
    userSecretRef:
      key: user
      name: nvidia-registry
{{- end }}
{{- if and $credentials.suseRegistry.username $credentials.suseRegistry.password }}
  suseRegistry:
    tokenSecretRef:
      key: token
      name: suse-registry
    userSecretRef:
      key: user
      name: suse-registry
{{- end }}
{{- end }}
