{{- $credentials := index .Values "credentials" -}}
{{- /*
  helm-managed lists what this chart declared in Settings, so the operator API and
  Settings page treat those values as read-only (they are changed through Helm
  only). Built from the same values as the spec below so the two cannot drift.
*/ -}}
{{- $helmManaged := dict -}}
{{- $catalogNames := list -}}
{{- range .Values.blueprintCatalogs }}
{{- if .name }}{{- $catalogNames = append $catalogNames .name -}}{{- end }}
{{- end }}
{{- if $catalogNames }}{{- $_ := set $helmManaged "blueprintCatalogs" $catalogNames -}}{{- end }}
apiVersion: ai-factory.suse.com/v1alpha1
kind: Settings
metadata:
  name: settings
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aif-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- if $helmManaged }}
    ai-factory.suse.com/helm-managed: {{ $helmManaged | toJson | quote }}
    {{- end }}
{{- if or (and $credentials.applicationCollection.username $credentials.applicationCollection.password)
          (and $credentials.nvidia.username $credentials.nvidia.password)
          (and $credentials.suseRegistry.username $credentials.suseRegistry.password)
          .Values.appCatalog.remoteUrl
          .Values.blueprintCatalogs }}
spec:
{{- if .Values.appCatalog.remoteUrl }}
  appCatalog:
    remoteUrl: {{ .Values.appCatalog.remoteUrl | quote }}
{{- end }}
{{- if and $credentials.applicationCollection.username $credentials.applicationCollection.password }}
  applicationCollection:
    tokenSecretRef:
      key: token
      name: application-collection
    userSecretRef:
      key: user
      name: application-collection
{{- end }}
{{- if and $credentials.nvidia.username $credentials.nvidia.password }}
  nvidia:
    tokenSecretRef:
      key: token
      name: nvidia-registry
    userSecretRef:
      key: user
      name: nvidia-registry
{{- end }}
{{- if and $credentials.suseRegistry.username $credentials.suseRegistry.password }}
  suseRegistry:
    tokenSecretRef:
      key: token
      name: suse-registry
    userSecretRef:
      key: user
      name: suse-registry
{{- end }}
{{- if .Values.blueprintCatalogs }}
  blueprintCatalogs:
    {{- range .Values.blueprintCatalogs }}
    - name: {{ .name | quote }}
      {{- if .repoURL }}
      repoURL: {{ .repoURL | quote }}
      {{- end }}
      {{- if .branch }}
      branch: {{ .branch | quote }}
      {{- end }}
      {{- with .paths }}
      paths: {{ toJson . }}
      {{- end }}
      {{- with .credSecretRef }}
      credSecretRef: {name: {{ .name | quote }}, key: {{ .key | quote }}}
      {{- end }}
      {{- with .caBundleSecretRef }}
      caBundleSecretRef: {name: {{ .name | quote }}, key: {{ .key | quote }}}
      {{- end }}
    {{- end }}
{{- end }}
{{- else }}
# Keep an empty spec map: removing spec altogether on a Helm 3 upgrade can
# delete UI-managed settings when the old manifest only declared rancherCatalog.
spec: {}
{{- end }}
