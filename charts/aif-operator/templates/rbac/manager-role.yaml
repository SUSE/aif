apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "aif-operator.labels" . | nindent 4 }}
  name: {{ include "aif-operator.fullname" . }}
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - create
      - get
      - patch
      # list+watch back the extension-namespace watch in SetupWithManager,
      # field-selector-scoped in the manager's cache to just that one
      # namespace by name — this grant is unavoidably cluster-wide (RBAC has
      # no per-object-name scoping for list/watch), but what the operator
      # actually caches and receives events for stays to that single object.
      - list
      - watch
  # The extension chart's own objects. Helm applies them under the operator's
  # ServiceAccount, so these are the operator's verbs. Cluster-scoped rather
  # than a Role in the extensions namespace: that namespace can be deleted out
  # from under us and would take the Role with it, leaving every reinstall
  # Forbidden with no way back.
  #
  # `watch` is also required by installaiextension_controller's reconciler
  # cache. Without it the controller-runtime informer for *v1.Service fails to
  # start and hot-loops the kube-apiserver with rejected watch requests.
  - apiGroups:
      - ""
    resources:
      - configmaps
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - delete
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - replicasets
      - statefulsets
    verbs:
      - delete
      - get
      - list
      # restartImagePullBackOffPods stores its bounce counter as an annotation
      # on the pod's controllerRef — usually the ReplicaSet behind a
      # Helm-installed Deployment. Only the extensions-namespace Role used to
      # grant this, so the cap silently failed to persist anywhere else.
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
      - roles
    verbs:
      - delete
      - get
      - list
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - installaiextensions
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - installaiextensions/finalizers
    verbs:
      - update
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - installaiextensions/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      # Watches for Rancher's catalog.cattle.io CRDs becoming Established, so a
      # reconcile blocked on RancherUnavailable wakes up immediately instead of
      # waiting out its backoff (up to 15 minutes).
      - watch
  - apiGroups:
      - catalog.cattle.io
    resources:
      - clusterrepos
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - catalog.cattle.io
    resources:
      - clusterrepos/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - catalog.cattle.io
    resources:
      - uiplugins
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - catalog.cattle.io
    resources:
      - uiplugins/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - settings
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - settings/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - blueprints
    verbs:
      - get
      - list
      - watch
      - patch
      - create
      - delete
      - update
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - aiworkloads
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - aiworkloads/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - aiworkloads/finalizers
    verbs:
      - update
  - apiGroups:
      - fleet.cattle.io
    resources:
      - bundledeployments
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - fleet.cattle.io
    resources:
      - bundles
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - fleet.cattle.io
    resources:
      - gitrepos
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - fleet.cattle.io
    resources:
      - helmops
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch

