apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "aif-operator.labels" . | nindent 4 }}
  name: {{ include "aif-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.manager.replicaCount }}
  selector:
    matchLabels:
      {{- include "aif-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.manager.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "aif-operator.labels" . | nindent 8 }}
    spec:
      containers:
        - name: manager
          image: "{{ with (coalesce .Values.global.imageRegistry .Values.manager.image.registry) }}{{ . }}/{{ end }}{{ .Values.manager.image.repository }}:{{ .Values.manager.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.manager.image.pullPolicy }}
          command:
            - /manager
          args:
          {{- if .Values.metrics.enable }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
          {{- else }}
            - --metrics-bind-address=0
          {{- end }}
            - --health-probe-bind-address=:8081
          {{- range .Values.manager.args }}
            - {{ . }}
          {{- end }}
          {{- if .Values.manager.allowInsecureRegistryTLS }}
            - --allow-insecure-registry-tls
          {{- end }}
          {{- with .Values.manager.allowedRegistryHosts }}
            - --allowed-registry-hosts={{ join "," . }}
          {{- end }}
            - --api-bind-address=:{{ .Values.api.port }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          {{- if .Values.manager.probes.liveness.enabled }}
          livenessProbe:
            {{- omit .Values.manager.probes.liveness "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.manager.probes.readiness.enabled }}
          readinessProbe:
            {{- omit .Values.manager.probes.readiness "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.manager.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.manager.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_SERVICE
              # Static at install time (chart-derived name); not a fieldRef because
              # the service name is determined by the chart, not the pod's runtime state.
              value: {{ include "aif-operator.fullname" . | quote }}
            - name: EXTENSION_NAMESPACE
              value: {{ include "aif-operator.extensionsNamespace" . | quote }}
            - name: CHART_VERSION
              value: {{ .Chart.Version | quote }}
          {{- range .Values.manager.env }}
            - {{ toYaml . | nindent 14 | trim }}
          {{- end }}
          volumeMounts:
            - mountPath: /home/nonroot/.cache
              name: helm-cache
      {{- include "aif-operator.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "aif-operator.fullname" . }}
      # Shutdown spends this budget three ways, and all three have to fit or the
      # kubelet SIGKILLs the operator partway through: draining in-flight
      # reconciles (30s, the manager's GracefulShutdownTimeout), a Helm write
      # finishing on borrowed time so a restart does not fail the release (10s,
      # helm.ShutdownGrace, inside the drain), and handing the leader lease back
      # so the next pod does not wait out its expiry (up to 10s, client-go's
      # RenewDeadline, after the drain). 30 + 10 = 40, and 60 leaves headroom.
      #
      # A hard kill is the one outcome worth paying for: Helm writes a release
      # revision as pending before it applies anything, so a process killed
      # mid-write leaves the release wedged in a state no reconcile recovers
      # from. cmd.TestShutdownFitsInTheGracePeriod reads this number.
      terminationGracePeriodSeconds: 60
      volumes:
        - emptyDir: {}
          name: helm-cache
      {{- with .Values.manager.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
