{{- if and .Values.crds.manageWithJob .Values.crds.rbac.create }}
# RBAC for the CRD-apply hook Job. Created as pre-install/pre-upgrade hooks (with a
# lower weight than the Job) and torn down afterwards, so the installer only holds
# CRD-management permissions for the duration of the hook. Set crds.rbac.create=false
# to pre-provision this RBAC out-of-band in restricted environments (see values.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aif-operator.fullname" . }}-crd-apply
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aif-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aif-operator.fullname" . }}-crd-apply
  labels:
    {{- include "aif-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
  # create can't be constrained by resourceNames (the object has no name until it
  # exists), so it stays cluster-wide. `kubectl apply -f` on explicit files does a
  # per-object get/patch (create when absent) and never lists the collection, so
  # no `list` grant is needed. No delete either: the Job only applies CRDs, so
  # uninstall never removes them (or their CRs).
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - create
  # get/update/patch (the mutating server-side-apply path) are scoped to exactly
  # this chart's CRDs, so the hook can never mutate unrelated CRDs on the cluster.
  # Names are derived from files/crds/ so the list stays in sync as CRDs change.
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - update
      - patch
    resourceNames:
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
      - {{ (($.Files.Get $path) | fromYaml).metadata.name }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aif-operator.fullname" . }}-crd-apply
  labels:
    {{- include "aif-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aif-operator.fullname" . }}-crd-apply
subjects:
  - kind: ServiceAccount
    name: {{ include "aif-operator.fullname" . }}-crd-apply
    namespace: {{ .Release.Namespace }}
{{- end }}
