{{- if .Values.aiExtension.enabled }}
apiVersion: ai-factory.suse.com/v1alpha1
kind: InstallAIExtension
metadata:
  name: {{ .Values.aiExtension.extension.name }}
  labels:
    {{- include "aif-operator.labels" . | nindent 4 }}
spec:
  source:
    kind: {{ .Values.aiExtension.source.kind }}
    {{- if eq .Values.aiExtension.source.kind "Helm" }}
    helm:
      chartURL: {{ .Values.aiExtension.source.helm.chartURL | quote }}
      version: {{ .Values.aiExtension.source.helm.version | quote }}
      {{- with .Values.aiExtension.source.helm.auth }}
      auth:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.aiExtension.source.helm.tls }}
      tls:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Forward selected operator-level values to the managed aif-ui chart,
             UNLESS the user set the corresponding UI value explicitly under
             aiExtension.source.helm.values. Use presence checks (hasKey), not dict
             merges: Sprig's merge treats false and other zero values as empty and
             can clobber intentional overrides. */}}
      {{- $extra := deepCopy (.Values.aiExtension.source.helm.values | default dict) }}
      {{- $global := get $extra "global" | default dict }}
      {{- $image := get $extra "image" | default dict }}
      {{- $globalChanged := false }}
      {{- if and .Values.global.imageRegistry (kindIs "map" $global) (not (hasKey $global "imageRegistry")) (or (not (kindIs "map" $image)) (not (hasKey $image "registry"))) }}
      {{-   $_ := set $global "imageRegistry" .Values.global.imageRegistry }}
      {{-   $globalChanged = true }}
      {{- end }}
      {{- if and .Values.global.imagePullSecrets (kindIs "map" $global) (not (hasKey $global "imagePullSecrets")) }}
      {{-   $_ := set $global "imagePullSecrets" (deepCopy .Values.global.imagePullSecrets) }}
      {{-   $globalChanged = true }}
      {{- end }}
      {{- if $globalChanged }}
      {{-   $_ := set $extra "global" $global }}
      {{- end }}
      {{- $ac := default dict $extra.appCatalog }}
      {{- if not (hasKey $ac "useStaticCatalog") }}
      {{-   $_ := set $ac "useStaticCatalog" .Values.appCatalog.useStaticCatalog }}
      {{-   $_ := set $extra "appCatalog" $ac }}
      {{- end }}
      values:
        {{- toYaml $extra | nindent 8 }}
    {{- end }}
  extension:
    name: {{ .Values.aiExtension.extension.name | quote }}
    version: {{ .Values.aiExtension.extension.version | quote }}
{{- end }}
