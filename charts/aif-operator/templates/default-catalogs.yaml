{{- /*
Renders bundled Catalog CRs from files/blueprints/*.yaml. We inject the chart's
common labels (so they carry app.kubernetes.io/managed-by=Helm, which the
Settings reconciler's collision guard and swappable-default logic key on). The
author's metadata wins on any conflict. Gated by defaultBlueprints.enabled.

WARNING: Bundled Catalog files under files/blueprints/ must NOT set
app.kubernetes.io/managed-by — it is injected as "Helm" here, and the Settings
swappable-default guard depends on this value to detect unauthorized overrides.

Gated by defaultBlueprints.enabled and not gitSourced (git-sourced default is a
Fleet GitRepo instead; see default-catalog-gitrepo.yaml).
*/ -}}
{{- if and .Values.defaultBlueprints.enabled (not .Values.defaultBlueprints.gitSourced) }}
{{- range $path, $_ := .Files.Glob "files/blueprints/*.yaml" }}
{{- $cat := $.Files.Get $path | fromYaml }}
{{- if eq (index $cat "kind") "Catalog" }}
{{- $common := include "aif-operator.labels" $ | fromYaml }}
{{- $_ := set $cat "metadata" (merge (index $cat "metadata" | default dict) (dict "labels" $common)) }}
---
{{ toYaml $cat }}
{{- end }}
{{- end }}
{{- end }}
