apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aif-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aif-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aif-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cattle-ui-plugin-system
      podSelector:
        matchLabels:
          app: aif-ui
    ports:
    - protocol: TCP
      port: {{ .Values.api.port }}
