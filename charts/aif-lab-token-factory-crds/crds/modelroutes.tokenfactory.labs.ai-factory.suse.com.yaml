# Example lab-owned CRD. Helm installs crds/ once and never deletes it, which
# matches the Lab contract ("lab-owned CRDs are left in place" when disabled).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelroutes.tokenfactory.labs.ai-factory.suse.com
spec:
  group: tokenfactory.labs.ai-factory.suse.com
  scope: Namespaced
  names:
    kind: ModelRoute
    listKind: ModelRouteList
    plural: modelroutes
    singular: modelroute
    shortNames: [mroute]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [model, workloadRef]
              properties:
                model:
                  type: string
                  description: Public model name exposed on the endpoint.
                workloadRef:
                  type: string
                  description: Name of the backing AIWorkload.
                rateLimitPerMinute:
                  type: integer
                  default: 300
            status:
              type: object
              properties:
                phase:
                  type: string
                url:
                  type: string
