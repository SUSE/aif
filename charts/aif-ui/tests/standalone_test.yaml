suite: standalone mode — ClusterRepo and UIPlugin
templates:
  - templates/clusterrepo.yaml
  - templates/uiplugin.yaml
release:
  name: my-rel
  namespace: cattle-ui-plugin-system
chart:
  version: 9.9.9
  appVersion: 9.9.9
tests:
  - it: renders neither resource when embedded in aif-operator
    templates:
      - templates/clusterrepo.yaml
      - templates/uiplugin.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a ClusterRepo pointing at the service when standalone
    template: templates/clusterrepo.yaml
    set:
      standalone: true
    asserts:
      - containsDocument:
          kind: ClusterRepo
          apiVersion: catalog.cattle.io/v1
      - equal:
          path: metadata.name
          value: my-rel-aif-ui
      - equal:
          path: spec.url
          value: http://my-rel-aif-ui-svc.cattle-ui-plugin-system:8080

  - it: renders a UIPlugin with a version-pinned plugin endpoint when standalone
    template: templates/uiplugin.yaml
    set:
      standalone: true
    asserts:
      - containsDocument:
          kind: UIPlugin
          apiVersion: catalog.cattle.io/v1
      - equal:
          path: metadata.name
          value: my-rel-aif-ui
      - equal:
          path: spec.plugin.name
          value: aif-ui
      - equal:
          path: spec.plugin.endpoint
          value: http://my-rel-aif-ui-svc.cattle-ui-plugin-system:8080/plugin/aif-ui-9.9.9

  - it: quotes the plugin version so semver-like values stay strings
    template: templates/uiplugin.yaml
    set:
      standalone: true
    asserts:
      - equal:
          path: spec.plugin.version
          value: "9.9.9"
      - isType:
          path: spec.plugin.version
          type: string

  - it: declares the Rancher and extension version constraints
    template: templates/uiplugin.yaml
    set:
      standalone: true
    asserts:
      - equal:
          path: spec.plugin.metadata["catalog.cattle.io/display-name"]
          value: SUSE AI Factory
      - equal:
          path: spec.plugin.metadata["catalog.cattle.io/rancher-version"]
          value: ">= 2.10.0"
      - equal:
          path: spec.plugin.metadata["catalog.cattle.io/ui-extensions-version"]
          value: ">= 3.0.0 < 4.0.0"

  - it: requires auth and caching to stay enabled
    template: templates/uiplugin.yaml
    set:
      standalone: true
    asserts:
      - equal:
          path: spec.plugin.noAuth
          value: false
      - equal:
          path: spec.plugin.noCache
          value: false

  - it: tracks a custom service port in both resources
    templates:
      - templates/clusterrepo.yaml
      - templates/uiplugin.yaml
    set:
      standalone: true
      service.port: 9090
    asserts:
      - matchRegex:
          path: spec.url
          pattern: :9090$
        template: templates/clusterrepo.yaml
      - matchRegex:
          path: spec.plugin.endpoint
          pattern: :9090/plugin/
        template: templates/uiplugin.yaml

  # Regression companion to service_test.yaml: the service DNS name is
  # interpolated into both resources, so a name-length overflow would land here
  # too.
  - it: keeps the service host within 63 characters for a maximum-length release name
    templates:
      - templates/clusterrepo.yaml
      - templates/uiplugin.yaml
    release:
      name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    set:
      standalone: true
    asserts:
      - matchRegex:
          path: spec.url
          pattern: ^http://.{1,63}\.cattle-ui-plugin-system:8080$
        template: templates/clusterrepo.yaml
      - matchRegex:
          path: spec.plugin.endpoint
          pattern: ^http://.{1,63}\.cattle-ui-plugin-system:8080/
        template: templates/uiplugin.yaml
