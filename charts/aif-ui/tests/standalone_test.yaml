suite: standalone mode — extension catalog
templates:
  - templates/*.yaml
release:
  name: my-rel
  namespace: cattle-ui-plugin-system
chart:
  version: 9.9.9
  appVersion: "2.2"
tests:
  - it: renders no ClusterRepo when embedded in aif-operator
    template: templates/clusterrepo.yaml
    asserts:
      - hasDocuments:
          count: 0

  # Standalone is an extension catalog, the shape Rancher's own "Import
  # Extension Catalog" produces. Rancher installs the extension from it, which
  # is what links the installed UIPlugin to its catalog chart (logo,
  # description, no Third-Party tag). A UIPlugin rendered here would collide
  # with the one that install creates.
  # Every template in the chart, through the suite's glob, so a UIPlugin added
  # back in a new file is caught too.
  - it: renders no UIPlugin when standalone
    set:
      standalone: true
    asserts:
      - not: true
        containsDocument:
          kind: UIPlugin
          apiVersion: catalog.cattle.io/v1

  - it: renders a ClusterRepo pointing at the service when standalone
    template: templates/clusterrepo.yaml
    set:
      standalone: true
    asserts:
      - containsDocument:
          kind: ClusterRepo
          apiVersion: catalog.cattle.io/v1
      - equal:
          path: metadata.name
          value: my-rel-aif-ui
      - equal:
          path: spec.url
          value: http://aif-ui-svc.cattle-ui-plugin-system:8080

  # The extension chart's UIPlugin endpoint is fixed at build time to
  # http://<image>-svc.cattle-ui-plugin-system:8080/..., so the Service has to
  # carry that name however the release is called.
  - it: names the service after the extension, not the release, when standalone
    template: templates/service.yaml
    set:
      standalone: true
    asserts:
      - equal:
          path: metadata.name
          value: aif-ui-svc

  - it: refuses a release named after the extension
    template: templates/clusterrepo.yaml
    release:
      name: aif-ui
    set:
      standalone: true
    asserts:
      - failedTemplate:
          errorPattern: "must not be named \"aif-ui\""

  - it: refuses a namespace other than cattle-ui-plugin-system
    template: templates/clusterrepo.yaml
    release:
      namespace: other-ns
    set:
      standalone: true
    asserts:
      - failedTemplate:
          errorPattern: "install into the cattle-ui-plugin-system namespace"

  - it: refuses a service port other than 8080
    template: templates/clusterrepo.yaml
    set:
      standalone: true
      service.port: 9090
    asserts:
      - failedTemplate:
          errorPattern: "service.port must be 8080"

  - it: allows any of those when embedded in aif-operator
    template: templates/clusterrepo.yaml
    release:
      name: aif-ui
      namespace: other-ns
    set:
      service.port: 9090
    asserts:
      - notFailedTemplate: {}
