suite: NOTES.txt post-install guidance
templates:
  - templates/NOTES.txt
release:
  name: my-rel
  namespace: cattle-ui-plugin-system
chart:
  version: 9.9.9
  appVersion: "2.2"
tests:
  - it: reports the release and namespace
    template: templates/NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: "Release: my-rel"
      - matchRegexRaw:
          pattern: "Namespace: cattle-ui-plugin-system"

  - it: prints a chart repository URL matching the rendered service
    template: templates/NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: "http://my-rel-aif-ui-svc\\.cattle-ui-plugin-system:8080"

  - it: prints verification commands naming the real deployment and service
    template: templates/NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: "kubectl get deploy my-rel-aif-ui -n cattle-ui-plugin-system"
      - matchRegexRaw:
          pattern: "kubectl get svc my-rel-aif-ui-svc -n cattle-ui-plugin-system"

  # Helm never renders NOTES.txt on uninstall, so the only place to warn about
  # the kept ConfigMap is here, at install/upgrade time. Helm's own uninstall
  # output names the object but not how to remove it (SUSEAI-1039).
  - it: names the kept ConfigMap and how to delete it
    template: templates/NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: "helm.sh/resource-policy: keep"
      - matchRegexRaw:
          pattern: "kubectl delete configmap aif-ui-config -n cattle-ui-plugin-system"

  - it: points the delete command at the release namespace
    template: templates/NOTES.txt
    release:
      namespace: other-ns
    asserts:
      - matchRegexRaw:
          pattern: "kubectl delete configmap aif-ui-config -n other-ns"

  - it: tracks a custom service port
    template: templates/NOTES.txt
    set:
      service.port: 9090
    asserts:
      - matchRegexRaw:
          pattern: "http://my-rel-aif-ui-svc\\.cattle-ui-plugin-system:9090"
