suite: values.schema.json contract
templates:
  - templates/deployment.yaml
release:
  name: my-rel
  namespace: cattle-ui-plugin-system
chart:
  version: 9.9.9
  appVersion: 9.9.9
tests:
  - it: accepts the shipped defaults
    template: templates/deployment.yaml
    asserts:
      - notFailedTemplate: {}

  - it: rejects an unknown top-level key
    template: templates/deployment.yaml
    set:
      totallyBogusKey: 1
    asserts:
      - failedTemplate:
          errorPattern: additional properties .*totallyBogusKey.* not allowed

  - it: rejects a pull policy outside the enum
    template: templates/deployment.yaml
    set:
      image.pullPolicy: Sometimes
    asserts:
      - failedTemplate:
          errorPattern: pullPolicy

  - it: rejects a negative replica count
    template: templates/deployment.yaml
    set:
      replicaCount: -1
    asserts:
      - failedTemplate:
          errorPattern: replicaCount

  - it: rejects a service type outside the enum
    template: templates/deployment.yaml
    set:
      service.type: Bogus
    asserts:
      - failedTemplate:
          errorPattern: type

  - it: rejects an unknown operator connection property
    template: templates/deployment.yaml
    set:
      operator.bogus: x
    asserts:
      - failedTemplate:
          errorPattern: additional properties

  - it: rejects an unknown appCatalog property
    template: templates/deployment.yaml
    set:
      appCatalog.bogus: x
    asserts:
      - failedTemplate:
          errorPattern: additional properties

  - it: accepts a fully specified valid override set
    template: templates/deployment.yaml
    set:
      replicaCount: 2
      standalone: true
      image.pullPolicy: Always
      service.type: NodePort
      appCatalog.useStaticCatalog: false
      operator.namespace: custom-ns
    asserts:
      - notFailedTemplate: {}
