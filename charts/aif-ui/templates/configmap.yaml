# NOTE: The UI extension always reads this ConfigMap from cattle-ui-plugin-system
# (hardcoded), so install this chart in that namespace. Operator coordinates are
# installation settings: Helm or the InstallAIExtension controller writes them
# here and the UI discovers them automatically.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aif-ui-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aif-ui.labels" . | nindent 4 }}
data:
  operatorNamespace: {{ .Values.operator.namespace | quote }}
  operatorService:   {{ .Values.operator.service   | quote }}
  useStaticCatalog:    {{ .Values.appCatalog.useStaticCatalog | quote }}
