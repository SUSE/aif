---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: settings.ai-factory.suse.com
spec:
  group: ai-factory.suse.com
  names:
    kind: Settings
    listKind: SettingsList
    plural: settings
    shortNames:
    - aiplmset
    singular: settings
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.lastApplied
      name: Last Applied
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Settings is the Schema for the settings API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SettingsSpec defines the desired state of Settings.
            properties:
              appCatalog:
                description: AppCatalog configures the static application catalog.
                properties:
                  remoteUrl:
                    description: |-
                      RemoteURL is an optional URL to a remote catalog JSON document. When set,
                      the operator fetches this (and only this) URL on behalf of the UI. When
                      empty, the operator serves its bundled default catalog. Must be an http(s)
                      URL that resolves to a public address; internal/private destinations are
                      rejected.
                    type: string
                type: object
              applicationCollection:
                description: ApplicationCollection configures SUSE Application Collection.
                properties:
                  caBundleSecretRef:
                    description: |-
                      CABundleSecretRef references a Secret containing the PEM CA bundle used
                      to verify the configured chart registry. The Settings controller mirrors
                      this value as "cacerts" in Rancher/Fleet registry auth Secrets.
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        type: string
                      name:
                        description: Name is the Secret name.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  categories:
                    description: Categories filters catalog entries by category.
                    items:
                      type: string
                    type: array
                  tokenSecretRef:
                    description: TokenSecretRef references the access token secret.
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        type: string
                      name:
                        description: Name is the Secret name.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  userSecretRef:
                    description: UserSecretRef references the username secret.
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        type: string
                      name:
                        description: Name is the Secret name.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                type: object
              fleet:
                description: Fleet configures Fleet GitOps integration.
                properties:
                  authType:
                    description: AuthType is the HTTPS authentication method.
                    enum:
                    - token
                    - basic
                    type: string
                  branch:
                    default: main
                    description: Branch is the Git branch to track.
                    type: string
                  caBundleSecretRef:
                    description: |-
                      CABundleSecretRef references a Secret containing the PEM CA bundle used
                      to verify an HTTPS Git server. AIF and the generated Fleet GitRepo consume
                      the same bundle so private Git has one trust configuration.
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        type: string
                      name:
                        description: Name is the Secret name.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  credSecretRef:
                    description: CredSecretRef references the Git credential secret.
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        type: string
                      name:
                        description: Name is the Secret name.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  repoURL:
                    description: RepoURL is the Git repository URL.
                    type: string
                  username:
                    description: |-
                      Username is the HTTPS Git username. It defaults to "token" for token
                      authentication. Basic authentication requires this field or a username
                      key in the referenced credential Secret.
                    type: string
                type: object
              nvidia:
                description: Nvidia configures NVIDIA NGC integration.
                properties:
                  caBundleSecretRef:
                    description: |-
                      CABundleSecretRef references a Secret containing the PEM CA bundle used
                      to verify a configured mirrored NVIDIA chart registry. The Settings
                      controller mirrors this value as "cacerts" in Rancher/Fleet registry auth
                      Secrets. It is unused by the public NGC chart repositories.
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        type: string
                      name:
                        description: Name is the Secret name.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  tokenSecretRef:
                    description: TokenSecretRef references the NGC API key secret.
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        type: string
                      name:
                        description: Name is the Secret name.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  userSecretRef:
                    description: UserSecretRef references the username secret (NGC
                      username; conventionally "$oauthtoken").
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        type: string
                      name:
                        description: Name is the Secret name.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                type: object
              rancherCatalog:
                description: |-
                  RancherCatalog configures access to Rancher's catalog API, used to fetch
                  charts from git-backed ClusterRepos.
                properties:
                  caBundleSecretRef:
                    description: |-
                      CABundleSecretRef references a Secret holding the PEM CA certificate(s)
                      that signed Rancher's serving certificate. When unset, system roots are
                      used (unless InsecureSkipVerify is set).
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        type: string
                      name:
                        description: Name is the Secret name.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  insecureSkipVerify:
                    description: |-
                      InsecureSkipVerify skips TLS verification of the Rancher API. Development
                      only — do not use in production/air-gapped installs.
                    type: boolean
                  tokenSecretRef:
                    description: |-
                      TokenSecretRef references a Secret (in the operator namespace) holding a
                      Rancher API token. Required for git-backed ClusterRepos — Rancher's Steve
                      API rejects the operator ServiceAccount token. When unset, git-backed
                      ClusterRepos are not installable.
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        type: string
                      name:
                        description: Name is the Secret name.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  url:
                    description: |-
                      URL is the in-cluster Rancher API endpoint. Defaults to
                      https://rancher.cattle-system.svc when empty.
                    type: string
                type: object
              registryEndpoints:
                description: RegistryEndpoints configures custom chart repositories
                  for air-gap deployments.
                properties:
                  applicationCollection:
                    description: ApplicationCollection overrides the SUSE App Collection
                      chart repository URL.
                    type: string
                  nvidia:
                    description: |-
                      Nvidia is the OCI URL of a mirrored NVIDIA chart repository for air-gapped installs
                      (e.g. oci://registry.example.com/nvidia). When empty, NVIDIA charts are pulled from the
                      public NGC HTTPS repositories; when set, a single gated OCI ClusterRepo is created at this URL.
                      Note: this is the chart-repo URL only — NVIDIA container images still resolve to nvcr.io and
                      require node-level registry redirection (e.g. containerd hosts.toml) in a true air-gap.
                    type: string
                  suseRegistry:
                    description: SUSERegistry overrides the default SUSE Registry
                      chart repository URL.
                    type: string
                type: object
              suseRegistry:
                description: SUSERegistry configures SUSE Registry integration.
                properties:
                  caBundleSecretRef:
                    description: |-
                      CABundleSecretRef references a Secret containing the PEM CA bundle used
                      to verify the configured chart registry. The Settings controller mirrors
                      this value as "cacerts" in Rancher/Fleet registry auth Secrets.
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        type: string
                      name:
                        description: Name is the Secret name.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  refreshIntervalMinutes:
                    default: 10
                    description: RefreshIntervalMinutes is the NIM index refresh cadence.
                    format: int32
                    type: integer
                  tokenSecretRef:
                    description: TokenSecretRef references the access token secret.
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        type: string
                      name:
                        description: Name is the Secret name.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  userSecretRef:
                    description: UserSecretRef references the username secret.
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        type: string
                      name:
                        description: Name is the Secret name.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                type: object
            type: object
          status:
            description: SettingsStatus defines the observed state of Settings.
            properties:
              conditions:
                description: Conditions represent the latest observations of the Settings
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastApplied:
                description: LastApplied is when settings were last applied.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation observed by the
                  controller.
                format: int64
                minimum: 0
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
