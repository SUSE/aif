---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: labs.ai-factory.suse.com
spec:
  group: ai-factory.suse.com
  names:
    kind: Lab
    listKind: LabList
    plural: labs
    shortNames:
    - aiflab
    singular: lab
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.enabled
      name: Enabled
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Lab is an optional AIF extension that admins can enable or disable.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LabSpec defines the desired state of Lab.
            properties:
              catalogRef:
                description: CatalogRef takes source and extension from a LabCatalog
                  entry.
                properties:
                  catalog:
                    description: Catalog is the LabCatalog name.
                    minLength: 1
                    type: string
                  entry:
                    description: Entry is the entry name inside the catalog.
                    minLength: 1
                    type: string
                required:
                - catalog
                - entry
                type: object
              description:
                type: string
              displayName:
                type: string
              enabled:
                description: Enabled turns the lab on (child InstallAIExtension exists)
                  or off.
                type: boolean
              extension:
                description: |-
                  ExtensionConfig identifies the UI extension managed by the controller.
                  For Helm sources, a UIPlugin CR with this name is created by the operator.
                  For Git sources, the UIPlugin is installed via Helm from the git-hosted chart repo.
                properties:
                  name:
                    description: |-
                      Name is the UIPlugin resource name to verify after chart installation.
                      This must match the UIPlugin name created by the Helm chart.
                    minLength: 1
                    type: string
                  version:
                    description: Version is the expected extension version in the
                      UIPlugin spec.
                    minLength: 1
                    type: string
                required:
                - name
                - version
                type: object
              maturity:
                enum:
                - experimental
                - preview
                type: string
              source:
                description: Source and Extension are set for a hand-made lab (no
                  catalogRef).
                properties:
                  git:
                    description: Git is populated when Kind=Git.
                    properties:
                      branch:
                        default: gh-pages
                        description: Branch is the git branch serving the extension
                          assets (typically "gh-pages").
                        minLength: 1
                        type: string
                      repo:
                        description: Repo is the git repository URL containing the
                          extension's index.yaml.
                        minLength: 1
                        type: string
                    required:
                    - branch
                    - repo
                    type: object
                  helm:
                    description: Helm is populated when Kind=Helm.
                    properties:
                      auth:
                        description: |-
                          Auth optionally supplies credentials to pull the chart from an
                          authenticated registry. Omit for anonymous/public registries.
                        properties:
                          basic:
                            description: Basic authenticates with a username + token/password
                              pair.
                            properties:
                              tokenSecretRef:
                                description: TokenSecretRef references the token/password
                                  secret key.
                                properties:
                                  key:
                                    description: Key is the key within the Secret.
                                    minLength: 1
                                    type: string
                                  name:
                                    description: Name is the Secret name.
                                    minLength: 1
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                              userSecretRef:
                                description: UserSecretRef references the username
                                  secret key.
                                properties:
                                  key:
                                    description: Key is the key within the Secret.
                                    minLength: 1
                                    type: string
                                  name:
                                    description: Name is the Secret name.
                                    minLength: 1
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            required:
                            - tokenSecretRef
                            - userSecretRef
                            type: object
                          dockerConfig:
                            description: DockerConfig authenticates using a kubernetes.io/dockerconfigjson
                              Secret.
                            properties:
                              secretRef:
                                description: SecretRef references the dockerconfigjson
                                  Secret by name.
                                properties:
                                  name:
                                    description: Name is the Secret name.
                                    type: string
                                required:
                                - name
                                type: object
                            required:
                            - secretRef
                            type: object
                          token:
                            description: Token authenticates with a token only; the
                              username defaults to "$oauthtoken".
                            properties:
                              tokenSecretRef:
                                description: TokenSecretRef references the token secret
                                  key.
                                properties:
                                  key:
                                    description: Key is the key within the Secret.
                                    minLength: 1
                                    type: string
                                  name:
                                    description: Name is the Secret name.
                                    minLength: 1
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            required:
                            - tokenSecretRef
                            type: object
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of basic, token, or dockerConfig must
                            be set
                          rule: '[has(self.basic), has(self.token), has(self.dockerConfig)].filter(x,
                            x).size() == 1'
                      chartURL:
                        description: |-
                          ChartURL is the Helm chart repository URL (oci:// or https://).
                          The Helm release name is derived from the last path segment of this URL.
                        minLength: 1
                        pattern: ^(oci://|https://).+
                        type: string
                      tls:
                        description: |-
                          TLS optionally configures registry TLS trust for the chart pull. Applies to
                          oci:// and https:// registries. Omit to use the operator's system trust store.
                        properties:
                          acknowledgeInsecure:
                            description: |-
                              AcknowledgeInsecure is a required safety gate for insecureSkipVerify: it must
                              be set to true whenever insecureSkipVerify is true. This makes disabling TLS
                              verification an explicit, auditable choice rather than a single-field accident.
                              It has no effect on its own.
                            type: boolean
                          caSecretRef:
                            description: CASecretRef references a PEM CA bundle used
                              to verify the registry certificate.
                            properties:
                              key:
                                description: Key is the key within the Secret.
                                minLength: 1
                                type: string
                              name:
                                description: Name is the Secret name.
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          clientTLSSecretRef:
                            description: |-
                              ClientTLSSecretRef references a kubernetes.io/tls secret (tls.crt, tls.key)
                              for mutual TLS.
                            properties:
                              name:
                                description: Name is the Secret name.
                                type: string
                            required:
                            - name
                            type: object
                          insecureSkipVerify:
                            description: |-
                              InsecureSkipVerify disables registry TLS certificate verification.
                              DANGEROUS: use only for testing; prefer caSecretRef. Requires
                              acknowledgeInsecure=true, and the operator must be deployed with insecure
                              registry TLS enabled (manager.allowInsecureRegistryTLS).
                            type: boolean
                        type: object
                        x-kubernetes-validations:
                        - message: tls must set at least one of caSecretRef, insecureSkipVerify,
                            or clientTLSSecretRef
                          rule: has(self.caSecretRef) || (has(self.insecureSkipVerify)
                            && self.insecureSkipVerify) || has(self.clientTLSSecretRef)
                        - message: caSecretRef must not be set when insecureSkipVerify
                            is true
                          rule: '!((has(self.insecureSkipVerify) && self.insecureSkipVerify)
                            && has(self.caSecretRef))'
                        - message: insecureSkipVerify requires acknowledgeInsecure
                            to be set to true
                          rule: '!(has(self.insecureSkipVerify) && self.insecureSkipVerify)
                            || (has(self.acknowledgeInsecure) && self.acknowledgeInsecure)'
                      values:
                        additionalProperties:
                          x-kubernetes-preserve-unknown-fields: true
                        description: Values are optional Helm values overrides passed
                          to the chart installation.
                        type: object
                      version:
                        description: Version is the chart version to install.
                        minLength: 1
                        type: string
                    required:
                    - chartURL
                    - version
                    type: object
                    x-kubernetes-validations:
                    - message: an https:// chartURL combined with tls must point directly
                        at a chart archive ending in .tgz (repository-style https+tls
                        does not honor version); use an oci:// chartURL for repository/version
                        resolution
                      rule: '!(self.chartURL.startsWith(''https://'') && has(self.tls))
                        || self.chartURL.endsWith(''.tgz'')'
                  kind:
                    description: |-
                      Kind selects the source type for the UI extension assets.
                      "Helm" installs a Helm chart that deploys a container serving extension assets and creates a URL-based ClusterRepo.
                      "Git" creates a ClusterRepo pointing to a git repository branch.
                    enum:
                    - Helm
                    - Git
                    type: string
                required:
                - kind
                type: object
                x-kubernetes-validations:
                - message: helm is required when kind is Helm
                  rule: 'self.kind == ''Helm'' ? has(self.helm) : true'
                - message: git must not be set when kind is Helm
                  rule: 'self.kind == ''Helm'' ? !has(self.git) : true'
                - message: git is required when kind is Git
                  rule: 'self.kind == ''Git'' ? has(self.git) : true'
                - message: helm must not be set when kind is Git
                  rule: 'self.kind == ''Git'' ? !has(self.helm) : true'
              ui:
                description: LabUI describes how the lab is surfaced in the AIF UI.
                properties:
                  icon:
                    type: string
                  label:
                    type: string
                  routeName:
                    type: string
                type: object
            required:
            - enabled
            type: object
            x-kubernetes-validations:
            - message: set exactly one of catalogRef, or both source and extension
              rule: 'has(self.catalogRef) ? (!has(self.source) && !has(self.extension))
                : (has(self.source) && has(self.extension))'
          status:
            description: LabStatus defines the observed state of Lab.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              extensionRef:
                description: ExtensionRef is the name of the child InstallAIExtension.
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: LabPhase is the lifecycle phase of a Lab.
                enum:
                - Disabled
                - Pending
                - Installing
                - Ready
                - Failed
                type: string
              resolvedChartURL:
                description: ResolvedChartURL and ResolvedVersion are the effective
                  chart reference.
                type: string
              resolvedVersion:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
