name: Build AIF UI Extension [Container and Helm Chart - Multi-Arch]

on:
  push:
    tags:
      - aif-ui-*

env:
  CHART_PATH: charts/aif-ui
  CHART_REGISTRY: oci://ghcr.io/suse/chart
  IMAGE_NAME: ghcr.io/suse/aif-ui

jobs:
  verify-ancestry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag is reachable from main or a matching release branch
        env:
          TAG_PREFIX: aif-ui-
        run: |
          git fetch --quiet origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release-*:refs/remotes/origin/release-*' \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          sha="${{ github.sha }}"
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#"$TAG_PREFIX"}"

          # main is the primary line and may cut any version.
          if git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "Tag is reachable from main"
            exit 0
          fi

          # Otherwise the commit must live on a release branch whose version
          # prefixes the tag (e.g. release-2.0 -> 2.0.*, release/2.2607 -> 2.2607.*).
          for ref in $(git for-each-ref --format='%(refname)' \
                'refs/remotes/origin/release-*' 'refs/remotes/origin/release/*'); do
            if git merge-base --is-ancestor "$sha" "$ref"; then
              branch="${ref#refs/remotes/origin/}"
              branch_version="${branch#release-}"
              branch_version="${branch_version#release/}"
              if [[ "$version" == "$branch_version".* ]]; then
                echo "Tag $tag is reachable from $branch and matches its version line"
                exit 0
              fi
              echo "Reachable from $branch but version '$version' != ${branch_version}.* — checking other branches"
            fi
          done

          echo "::error::Tag version '$version' is not reachable from origin/main or a release branch matching its major/minor line"
          exit 1

  prepare:
    needs: verify-ancestry
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.tags.outputs.VERSION }}
      PUBLISH: ${{ steps.tags.outputs.PUBLISH }}
      METADATA_TAGS: ${{ steps.tags.outputs.METADATA_TAGS }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Calculate tags
        id: tags
        shell: bash
        run: |
          ref="${{ github.ref }}"
          case "$ref" in
            refs/tags/aif-ui-*)
              VERSION="${ref#refs/tags/aif-ui-}"
              PUBLISH=true
              if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                {
                  echo "METADATA_TAGS<<EOF"
                  echo "$VERSION"
                  echo "latest"
                  echo "EOF"
                } >> "$GITHUB_OUTPUT"
              else
                {
                  echo "METADATA_TAGS<<EOF"
                  echo "$VERSION"
                  echo "EOF"
                } >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              VERSION="${{ github.sha }}"
              PUBLISH=false
              {
                echo "METADATA_TAGS<<EOF"
                echo "$VERSION"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PUBLISH=$PUBLISH" >> "$GITHUB_OUTPUT"

  build-container:
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: prepare
    if: needs.prepare.outputs.PUBLISH == 'true'
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: 'ui/'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --ignore-engines

      - name: Parse extension name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="aif-ui-${{ needs.prepare.outputs.VERSION }}"
          yarn parse-tag-name "$TAG" ${{ github.run_id }} "catalog"

      - name: Build extension image
        run: |
          TAG="aif-ui-${{ needs.prepare.outputs.VERSION }}"
          yarn publish-pkgs -c -i '' -r ghcr.io -o 'suse' -t "$TAG"

      # Standalone mode (charts/aif-ui, aif-ui.serviceName) assumes the extension
      # chart @rancher/shell's publish-pkgs just built points its UIPlugin at
      # "<chart name>-svc.cattle-ui-plugin-system:8080" — the Service name and
      # port that chart's own "Import Extension Catalog" dialog would have
      # created. That assumption holds only as long as: the `-i ''` above keeps
      # IMAGE_PREFIX empty, ui/package.json's name matches both
      # pkg/aif-ui/package.json's name (which feeds BASE_EXT into helmpatch) and
      # charts/aif-ui's own Chart.yaml name (which aif-ui.serviceName renders
      # from), and the chart's icon actually resolves against what the server
      # serves. None of that is caught by `helm template` or the extension's own
      # build — a silent mismatch here only ever shows up as the Extensions page
      # failing to load the plugin after install. Verify it here, before the
      # chart is pushed.
      - name: Verify the extension chart matches the server chart it expects
        run: |
          set -euo pipefail

          BASE_EXT=$(jq -r .name package.json)
          PKG_NAME=$(jq -r .name "pkg/${BASE_EXT}/package.json")
          SUSE_CHART_NAME=$(yq '.name' "$GITHUB_WORKSPACE/$CHART_PATH/Chart.yaml")

          echo "ui/package.json name:              ${BASE_EXT}"
          echo "pkg/${BASE_EXT}/package.json name: ${PKG_NAME}"
          echo "$CHART_PATH Chart.yaml name:        ${SUSE_CHART_NAME}"

          if [[ "${BASE_EXT}" != "${PKG_NAME}" || "${BASE_EXT}" != "${SUSE_CHART_NAME}" ]]; then
            echo "::error::extension name mismatch between ui/package.json (${BASE_EXT}), pkg/${BASE_EXT}/package.json (${PKG_NAME}) and $CHART_PATH/Chart.yaml (${SUSE_CHART_NAME}). These three names have to agree: BASE_EXT (derived from ui/package.json) drives the <BASE_EXT>-svc host @rancher/shell's helmpatch bakes into the extension chart, and it only matches a real Service if $CHART_PATH's Chart.yaml carries the same name."
            exit 1
          fi

          PKG_VERSION=$(jq -r .version "pkg/${BASE_EXT}/package.json")
          EXT_CHART="charts/${BASE_EXT}/${PKG_VERSION}"
          if [[ ! -f "${EXT_CHART}/values.yaml" || ! -f "${EXT_CHART}/Chart.yaml" ]]; then
            echo "::error::extension chart not found at ui/${EXT_CHART} after publish-pkgs; its layout (ui/charts/<pkg>/<version>) may have changed upstream in @rancher/shell"
            exit 1
          fi

          ENDPOINT=$(yq '.plugin.endpoint' "${EXT_CHART}/values.yaml")
          echo "extension chart plugin.endpoint: ${ENDPOINT}"

          RENDERED_SERVICE=$(helm template ci-check "$GITHUB_WORKSPACE/$CHART_PATH" \
            --namespace cattle-ui-plugin-system --set standalone=true \
            --show-only templates/service.yaml)
          SVC_NAME=$(yq '.metadata.name' <<< "$RENDERED_SERVICE")
          SVC_PORT=$(yq '.spec.ports[0].port' <<< "$RENDERED_SERVICE")
          EXPECTED_PREFIX="http://${SVC_NAME}.cattle-ui-plugin-system:${SVC_PORT}/"

          if [[ "${ENDPOINT}" != "${EXPECTED_PREFIX}"* ]]; then
            echo "::error::extension chart's plugin.endpoint (${ENDPOINT}) does not start with ${EXPECTED_PREFIX}, the Service $CHART_PATH renders in standalone mode (aif-ui.serviceName). The endpoint is fixed at build time by @rancher/shell's helmpatch script from IMAGE_PREFIX and BASE_EXT; a changed image prefix or a shell upgrade would break standalone mode silently at install time."
            exit 1
          fi

          ICON=$(yq '.icon' "${EXT_CHART}/Chart.yaml")
          if [[ "${ICON}" != plugin/* ]]; then
            echo "::error::extension chart's icon (${ICON}) is not a path under plugin/, so it will not resolve against the server's ClusterRepo URL"
            exit 1
          fi
          if ! grep -qF "/home/plugin-server/plugin-contents/${ICON}" "$GITHUB_WORKSPACE/build/Dockerfile.ui"; then
            echo "::error::build/Dockerfile.ui has no COPY placing a file at plugin-contents/${ICON}; the Extensions page icon (${ICON}) will 404"
            exit 1
          fi

          echo "Extension chart endpoint and icon verified against $CHART_PATH and build/Dockerfile.ui."

      - name: Rebase image onto patched BCI 15.7
        working-directory: .
        run: |
          VERSION="${{ needs.prepare.outputs.VERSION }}"
          docker build -f build/Dockerfile.ui \
            --build-arg BASE=$IMAGE_NAME:$VERSION \
            -t $IMAGE_NAME:$VERSION \
            .

      - name: Tag and push image
        run: |
          VERSION="${{ needs.prepare.outputs.VERSION }}"
          docker tag $IMAGE_NAME:$VERSION $IMAGE_NAME:$VERSION-${{ matrix.arch }}
          docker push $IMAGE_NAME:$VERSION-${{ matrix.arch }}

  manifest-and-chart:
    needs: [prepare, build-container]
    if: needs.prepare.outputs.PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          VERSION: ${{ needs.prepare.outputs.VERSION }}
          RELEASE_TAG: ${{ needs.prepare.outputs.METADATA_TAGS }}
        run: |
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            docker buildx imagetools create \
              -t $IMAGE_NAME:$tag \
              $IMAGE_NAME:$VERSION-amd64 \
              $IMAGE_NAME:$VERSION-arm64
          done <<< "${RELEASE_TAG}"

      - name: Update Chart.yaml versions
        run: |
          yq -i '.version = "${{ needs.prepare.outputs.VERSION }}"' $CHART_PATH/Chart.yaml
          yq -i '.appVersion = "${{ needs.prepare.outputs.VERSION }}"' $CHART_PATH/Chart.yaml
          yq -i '
            .annotations."helm.sh/images" =
            "- image: ghcr.io/suse/aif-ui:${{ needs.prepare.outputs.VERSION }}\n  name: aif-ui"
          ' $CHART_PATH/Chart.yaml
          yq -i '.image.tag = "${{ needs.prepare.outputs.VERSION }}"' $CHART_PATH/values.yaml

      - name: Package and push Helm chart
        run: |
          chart_package=$(helm package $CHART_PATH --destination . | awk '{print $NF}')
          helm push "$chart_package" $CHART_REGISTRY
