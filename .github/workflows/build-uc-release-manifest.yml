---
name: Build UC Release Manifest Container Image

'on':
  push:
    branches:
      - 'main'
      - 'release-*'
    paths:
      - 'uc-release-manifest/**'
      - '.github/workflows/build-uc-release-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/uc-release-manifest

jobs:
  build-and-push:
    # Manual runs are limited to main and release branches so that arbitrary
    # branch names don't end up as image tags in GHCR
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Read release manifest version
        id: manifest
        shell: bash
        run: |
          version=$(yq '.metadata.version' uc-release-manifest/release_manifest.yaml)
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "::error::metadata.version is not set in uc-release-manifest/release_manifest.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # NOTE: The image is FROM scratch with only a COPY so there is nothing to execute
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: latest follows main, the branch name tag (slashes sanitized by the
      # action) follows release branches, and the manifest version and commit SHA
      # tags allow consumers to pin a specific manifest
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=raw,value=${{ steps.manifest.outputs.version }}
            type=sha

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: uc-release-manifest
          file: uc-release-manifest/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
